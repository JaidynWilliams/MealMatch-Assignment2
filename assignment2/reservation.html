<!DOCTYPE html>
<html lang="en">
<head>
    <!--setting metadata and title-->
    <meta charset="UTF-8">
    <meta name="viewport" contents="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jaidyn Williams/106363738">
    <meta name="description" contents="Home Page for Website">
    <!--linking CSS-->
    <link rel="stylesheet" href="css/style.css">
    <title>Home</title>
</head>
<body>
    <!--Heading-->
    <header>
        <h1>MealMatch</h1>
    </header>

    <!--Navigation Menu-->
    <nav>
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="recommend.html">Recommendations</a>
        <a href="register.html">Register</a>
        <a href="reservation.html">Reservations</a>
        <a href="bill.html">Bill</a>
    </nav>

    <!--Page Contents-->
    <section>
        <h2>Reservations</h2>
        <!--Posting to server php-->
        <form id="reservationForm" method="POST" action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php"></form>
        <p>
            <!--Full Name-->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
        </p>
        <p>
            <!--Email-->
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email">
        </p>
        <p>
            <!--Phone Number-->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </p>
        <p>
            <!--Restaurant Name List-->
            <label for="restaurant">Restaurant:</label>
            <select id="restaurant" name="restaurant">
                <option value="">Select Restaurant</option>
                <option value="O'Flaherty's Tavern">O'Flaherty's Tavern</option>
                <option value="Red Lantern House">Red Lantern House</option>
                <option value="Trattoria Bellavita">Trattoria Bellavita</option>
                <option value="Spice Maharaja">Spice Maharaja</option>
                <option value="Le Petit Provence">Le Petit Provence</option>
                <option value="Burger Republic">Burger Republic</option>
            </select>
        </p>
        <p>
            <!--Date-->
            <label for="date">Reservation Date:</label>
            <input type="date" id="date" name="date">
        </p>
        <p>
            <!--Time-->
            <label for="time">Reservation Time:</label>
            <input type="time" id="time" name="time">
        </p>
        <p>
            <!--Number of People-->
            <label for="people">Number of People:</label>
            <input type="number" id="people" name="people" min="1">
        </p>
        <p>
            <!--Special Requests-->
            <label for="requests">Special Requests:</label>
            <textarea id="requests" name="requests" rows="4" cols="40"></textarea>
        </p>
        <p>
            <!--Deposit Amount-->
            <label for="depositAmount">Deposit Amount:</label>
            <input type="text" id="depositAmount" name="depositAmount" readonly value="$20 Per Person">
        </p>
        <p>
            <!--Deposit Method-->
            Deposit Method: 
            <input type="radio"
            id="voucher"
            name="payment"
            value="voucher">
            <label for="voucher">Voucher</label>

            <input type="radio"
            id="online"
            name="payment"
            value="online">
            <label for="online">Online Payment</label>
        </p>
        <p id="voucherSelection">
            <label for="voucherCode">
                Voucher Code:
            </label>
            <input type="text" id="voucherCode" name="voucherCode">
        </p>
        <p id="cardSection">
            <label for="cardNumber">
                Credit Card Number:
            </label>
            <input type="text" id="cardNumber" name="cardNumber">
        </p>
        <p>
            <button type="submit">
                Reserve Table
            </button>
        </p>
    </section>

    <!--Footer-->
    <footer>
        <p>&copy; 2026 MealMatch</p>
    </footer>
    
    <!--linking JavaScript file-->
    <script src="js/script.js"></script>
</body>
